# SPDX-License-Identifier: MIT

version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on PyPI, the documentation) or which can not carry
# a comment.
[[annotations]]
path = [
    "AUTHORS",
    "README.rst",
    "docs/**/*.rst",
    "docs/**/*.md",
    "aas_core3_1/py.typed",
    "dev/dev_scripts/.python-version",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 aas-core3.1-python AUTHORS"
SPDX-License-Identifier = "MIT"

# The snippets are inserted verbatim into the generated code by aas-core-codegen,
# so they must not carry a header of their own.
[[annotations]]
path = "dev/dev_scripts/codegen/snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 aas-core3.1-python AUTHORS"
SPDX-License-Identifier = "MIT"

# Test data and the recorded test outputs are generated and compared
# byte-by-byte, and JSON can not carry a comment.
[[annotations]]
path = "dev/test_data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 aas-core3.1-python AUTHORS"
SPDX-License-Identifier = "MIT"
